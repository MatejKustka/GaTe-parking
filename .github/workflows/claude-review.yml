name: AI review

# Claude reviews every pull request. Requires the repo secret ANTHROPIC_API_KEY
# and the Claude GitHub app (https://github.com/apps/claude). Skipped when the secret is missing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for GaŤe Parking, a student team project (React + TypeScript frontend, Node.js + Express + MongoDB backend).
            Follow CLAUDE.md, CONTRIBUTING.md and docs/SCOPE.md. Check, in this order:
            1. Correctness bugs and missing error handling.
            2. Security: committed secrets, missing auth/permission checks (users may only touch their own data, admins everything), unvalidated input.
            3. The PR stays inside its own task and does not change shared contracts (API shapes, DB schema) or other people's code without reason.
            4. Tests exist for new behaviour and docs are updated when the API changes.
            Be concise and friendly: many contributors are new to git and web development. Leave inline comments for concrete problems and one short summary comment. Do not nitpick formatting; CI already enforces it.
          claude_args: --max-turns 8

# Daily development: run only the database and use `npm run dev` on your machine
#   docker compose up -d mongo
# Full stack in containers (like production):
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/gate-parking
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - '8080:8080'
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo-data:
